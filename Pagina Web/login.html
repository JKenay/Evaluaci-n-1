<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MiTienda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor-logo">
            <h1 class="logo">MiTienda</h1>
        </div>
        <nav class="navegacion-principal">
            <ul class="lista-enlaces">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Blogs</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
            <div class="contenedor-usuario">
                <a href="login.html">Iniciar Sesión</a>
                <a href="registro.html">Registrar</a>
                <div class="carrito-icono">
                    🛒 <span id="contador-carrito">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="contenido-principal">
        <section class="seccion-contacto">
            <h2 class="titulo-seccion">Inicio de Sesión</h2>
            <form id="formulario-login" class="formulario" novalidate>
                
                <div class="grupo-control">
                    <label for="correo-login">Correo Electrónico:</label>
                    <input type="email" id="correo-login" class="entrada-datos" autocomplete="email">
                    <span class="mensaje-error" id="error-correo-login"></span>
                </div>

                <div class="grupo-control">
                    <label for="clave-login">Contraseña:</label>
                    <input type="password" id="clave-login" class="entrada-datos">
                    <span class="mensaje-error" id="error-clave-login"></span>
                </div>

                <button type="submit" class="boton-primario">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>2026 MiTienda</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
