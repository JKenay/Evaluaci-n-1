<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - MiTienda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor-logo">
            <h1 class="logo">MiTienda</h1>
        </div>
        <nav class="navegacion-principal">
            <ul class="lista-enlaces">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Blogs</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
            <div class="contenedor-usuario">
                <a href="login.html">Iniciar Sesión</a>
                <a href="registro.html">Registrar</a>
                <div class="carrito-icono">
                    🛒 <span id="contador-carrito">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="contenido-principal">
        <section class="seccion-contacto">
            <h2 class="titulo-seccion">Registro de Usuario</h2>
            <form id="formulario-registro" class="formulario" novalidate>
                
                <div class="grupo-control">
                    <label for="run">RUN (Sin puntos ni guion):</label>
                    <input type="text" id="run" class="entrada-datos" placeholder="Ej: 19011022K" autocomplete="off">
                    <span class="mensaje-error" id="error-run"></span>
                </div>

                <div class="grupo-control">
                    <label for="nombre-registro">Nombre:</label>
                    <input type="text" id="nombre-registro" class="entrada-datos" autocomplete="given-name">
                    <span class="mensaje-error" id="error-nombre-registro"></span>
                </div>

                <div class="grupo-control">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" class="entrada-datos" autocomplete="family-name">
                    <span class="mensaje-error" id="error-apellidos"></span>
                </div>

                <div class="grupo-control">
                    <label for="correo-registro">Correo Electrónico:</label>
                    <input type="email" id="correo-registro" class="entrada-datos" autocomplete="email">
                    <span class="mensaje-error" id="error-correo-registro"></span>
                </div>

                <div class="grupo-control">
                    <label for="clave-registro">Contraseña:</label>
                    <input type="password" id="clave-registro" class="entrada-datos">
                    <span class="mensaje-error" id="error-clave-registro"></span>
                </div>

                <div class="grupo-control">
                    <label for="clave-confirmar">Confirmar Contraseña:</label>
                    <input type="password" id="clave-confirmar" class="entrada-datos">
                    <span class="mensaje-error" id="error-clave-confirmar"></span>
                </div>

                <div class="grupo-control">
                    <label for="telefono">Teléfono (opcional):</label>
                    <input type="tel" id="telefono" class="entrada-datos" autocomplete="tel">
                </div>

                <div class="grupo-control">
                    <label for="fecha-nacimiento">Fecha de Nacimiento (opcional):</label>
                    <input type="date" id="fecha-nacimiento" class="entrada-datos">
                </div>

                <div class="grupo-control">
                    <label for="region">Región:</label>
                    <select id="region" class="entrada-datos">
                        <option value="">-- Seleccione la región --</option>
                    </select>
                    <span class="mensaje-error" id="error-region"></span>
                </div>

                <div class="grupo-control">
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" class="entrada-datos" disabled>
                        <option value="">-- Seleccione la comuna --</option>
                    </select>
                    <span class="mensaje-error" id="error-comuna"></span>
                </div>

                <div class="grupo-control">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" class="entrada-datos" autocomplete="street-address">
                    <span class="mensaje-error" id="error-direccion"></span>
                </div>

                <button type="submit" class="boton-primario">Registrar</button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>2026 MiTienda</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
